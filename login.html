<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#800000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Login — LiquorBelle</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com">
<link rel="preconnect" href="https://liquorbelle-mpesa-backend.onrender.com">
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dvqjgbdhp/image/upload/v1785585419/WhatsApp_Image_2026-08-01_at_2.42.56_PM_h8kxdn.jpg">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --primary:#800000;
  --primary-bright:#990000;
  --primary-dark:#5C0000;
  --sale-red:#D50000;
  --white:#FFFFFF;
  --bg:#F9F6F2;
  --bg2:#F2EDE7;
  --border:#E8E0D8;
  --text:#1A1A1A;
  --muted:#7A7368;
  --gold:#B8860B;
  --gold-light:#d4a017;
  --gold-bg:#fdf6e3;
  --btn-green:#22C55E;
  --btn-green-hover:#16A34A;
  --radius:24px;
  --radius-sm:14px;
  --radius-xs:10px;
  --shadow:0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg:0 20px 50px rgba(0,0,0,0.10);
  --font-body:'Inter',-apple-system,sans-serif;
}
body{
  background:var(--bg);
  font-family:var(--font-body);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* ===== TOP BAR ===== */
.top-bar{
  background:var(--primary);
  padding:14px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:2px solid var(--btn-green);
  box-shadow:0 2px 16px rgba(0,0,0,0.15);
  position:sticky;
  top:0;
  z-index:100;
  min-height:64px;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
}
.logo-img{
  height:38px;
  width:38px;
  object-fit:cover;
  border-radius:11px;
  background:white;
  padding:3px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}
.logo-text{
  font-size:1.1rem;
  font-weight:800;
  color:white;
  letter-spacing:-.3px;
}
.logo-text .gold{color:var(--gold-light);}
.back-link{
  color:rgba(255,255,255,0.85);
  font-size:.8rem;
  font-weight:600;
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  transition:color .2s;
  padding:6px 10px;
  border-radius:30px;
}
.back-link:hover{
  color:white;
  background:rgba(255,255,255,0.1);
}
.back-link:active{
  transform:scale(0.95);
}

/* ===== PAGE WRAP ===== */
.page-wrap{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 4% 40px;
}

/* ===== AUTH CARD ===== */
.auth-card{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow-lg);
  padding:32px 28px 28px;
  width:100%;
  max-width:420px;
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
  animation:slideUp .4s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}
.auth-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(90deg,var(--primary),var(--gold),var(--primary));
  background-size:200% 100%;
  animation:shimmer 3s ease-in-out infinite;
}
@keyframes shimmer{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}

.brand-icon{
  width:64px;
  height:64px;
  background:var(--gold-bg);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 12px;
  border:2px solid var(--gold);
  transition:transform .3s ease;
}
.brand-icon i{
  font-size:32px;
  color:var(--gold);
}
.auth-card h1{
  font-size:1.5rem;
  font-weight:800;
  text-align:center;
  color:var(--text);
  margin-bottom:2px;
}
.auth-card .lead{
  color:var(--muted);
  font-size:.9rem;
  text-align:center;
  margin-bottom:24px;
}

/* ===== SESSION EXPIRED BANNER ===== */
#sessionExpiredBanner{
  display:none;
  background:#FEE2E2;
  color:#991B1B;
  border:1px solid #FECACA;
  padding:12px 16px;
  border-radius:var(--radius-xs);
  font-size:.8rem;
  font-weight:600;
  margin-bottom:18px;
  text-align:center;
  align-items:center;
  justify-content:center;
  gap:8px;
  animation:shake .4s ease;
}
#sessionExpiredBanner.show{display:flex;}
#sessionExpiredBanner i{font-size:18px;}

@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  75%{transform:translateX(6px);}
}

/* ===== BANNER ===== */
.banner{
  padding:12px 16px;
  border-radius:var(--radius-xs);
  font-size:.78rem;
  font-weight:600;
  margin-bottom:18px;
  display:none;
  align-items:center;
  gap:10px;
}
.banner.show{display:flex;}
.banner.error{background:#FDECEC;color:var(--sale-red);border:1px solid #F5C2C2;}
.banner.success{background:#E8F5E9;color:var(--btn-green-hover);border:1px solid #B7E4BB;}
.banner.info{background:var(--gold-bg);color:var(--gold);border:1px solid #EAD9A8;}

/* ===== FIELD GROUP ===== */
.field-group{margin-bottom:18px;}
.field-label{
  display:block;
  font-size:.7rem;
  font-weight:700;
  color:var(--muted);
  margin-bottom:6px;
  letter-spacing:.3px;
  text-transform:uppercase;
}
.field-input-wrap{
  position:relative;
}
.field-input{
  width:100%;
  padding:14px 16px;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  font-family:var(--font-body);
  font-size:.95rem;
  color:var(--text);
  outline:none;
  transition:all .25s ease;
  background:var(--bg);
  -webkit-appearance:none;
  appearance:none;
}
.field-input:focus{
  border-color:var(--primary);
  background:white;
  box-shadow:0 0 0 4px rgba(128,0,0,0.08);
  transform:translateY(-1px);
}
.field-input.error{
  border-color:var(--sale-red);
  background:#fff5f5;
}
.field-input.success{
  border-color:var(--btn-green);
  background:#f0fff4;
}
.field-input::placeholder{
  color:var(--muted);
  opacity:0.6;
}
.field-error{
  font-size:.72rem;
  color:var(--sale-red);
  margin-top:5px;
  font-weight:600;
  display:none;
}
.field-error.show{display:block;}
.field-hint{
  font-size:.7rem;
  color:var(--muted);
  margin-top:4px;
}

/* ===== DIGIT GROUP (PIN) ===== */
.digit-group{
  display:flex;
  gap:12px;
  justify-content:center;
  margin:6px 0 4px;
}
.digit-box{
  width:56px;
  height:64px;
  text-align:center;
  font-size:1.5rem;
  font-weight:800;
  border:2px solid var(--border);
  border-radius:var(--radius-sm);
  background:var(--bg);
  outline:none;
  transition:all .25s ease;
  color:var(--text);
  font-family:var(--font-body);
  -webkit-appearance:none;
  appearance:none;
}
.digit-box:focus{
  border-color:var(--primary);
  background:white;
  box-shadow:0 0 0 4px rgba(128,0,0,0.08);
  transform:translateY(-2px) scale(1.02);
}
.digit-box.filled{
  border-color:var(--gold);
  background:var(--gold-bg);
}
.digit-box.error{
  border-color:var(--sale-red);
  background:#fff5f5;
  animation:shake .3s ease;
}
.digit-box:active{
  transform:scale(0.95);
}
@media(max-width:480px){
  .digit-box{
    width:48px;
    height:56px;
    font-size:1.3rem;
  }
}
@media(max-width:380px){
  .digit-box{
    width:42px;
    height:50px;
    font-size:1.1rem;
    gap:8px;
  }
}

.pin-toggle-row{
  display:flex;
  justify-content:flex-end;
  margin:-4px 0 14px;
}
.pin-toggle{
  background:none;
  border:none;
  color:var(--muted);
  font-size:.72rem;
  font-weight:600;
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:4px;
  padding:8px 12px;
  border-radius:30px;
  transition:all .2s;
  font-family:var(--font-body);
}
.pin-toggle:hover{
  color:var(--primary);
  background:var(--bg2);
}
.pin-toggle:active{
  transform:scale(0.95);
}
.pin-toggle i{font-size:14px;}

/* ===== BUTTONS ===== */
.btn-primary{
  width:100%;
  padding:15px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;
  border:none;
  border-radius:50px;
  font-weight:700;
  font-size:.95rem;
  cursor:pointer;
  transition:all .3s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-family:var(--font-body);
  position:relative;
  overflow:hidden;
}
.btn-primary::after{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,transparent,rgba(255,255,255,0.1),transparent);
  transform:translateX(-100%);
  transition:transform .6s;
}
.btn-primary:hover::after{
  transform:translateX(100%);
}
.btn-primary:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 30px rgba(128,0,0,0.3);
}
.btn-primary:active{
  transform:scale(0.97);
}
.btn-primary:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none !important;
  box-shadow:none !important;
}
.btn-primary .spinner{
  display:inline-block;
  width:18px;
  height:18px;
  border:2.5px solid rgba(255,255,255,0.35);
  border-radius:50%;
  border-top-color:white;
  animation:spin .6s linear infinite;
}

.btn-link{
  background:none;
  border:none;
  color:var(--primary);
  font-weight:700;
  font-size:.78rem;
  cursor:pointer;
  padding:8px 14px;
  border-radius:30px;
  transition:all .2s;
  font-family:var(--font-body);
}
.btn-link:hover{
  background:var(--bg2);
  text-decoration:none;
}
.btn-link:active{
  transform:scale(0.95);
}

/* ===== DIVIDER ===== */
.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:20px 0;
  color:var(--muted);
  font-size:.72rem;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--border);
}

/* ===== GOOGLE BUTTON ===== */
.google-btn{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:14px;
  background:white;
  border:2px solid var(--border);
  border-radius:50px;
  font-weight:600;
  font-size:.9rem;
  color:var(--text);
  cursor:pointer;
  transition:all .3s ease;
  font-family:var(--font-body);
  position:relative;
  overflow:hidden;
}
.google-btn::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg,rgba(128,0,0,0.03),rgba(184,134,11,0.03));
  opacity:0;
  transition:opacity .3s;
}
.google-btn:hover::before{
  opacity:1;
}
.google-btn:hover{
  border-color:var(--primary);
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
  transform:translateY(-2px);
}
.google-btn:active{
  transform:scale(0.97);
}
.google-btn:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none !important;
}
.google-btn img{
  width:20px;
  height:20px;
  flex-shrink:0;
}
.google-btn .spinner{
  display:inline-block;
  width:18px;
  height:18px;
  border:2px solid rgba(0,0,0,0.1);
  border-radius:50%;
  border-top-color:var(--gold);
  animation:spin .6s linear infinite;
}

/* ===== FOOTER LINKS ===== */
.footer-links{
  text-align:center;
  margin-top:18px;
  font-size:.8rem;
  color:var(--muted);
}
.footer-links a{
  color:var(--primary);
  font-weight:700;
  text-decoration:none;
  transition:color .2s;
  padding:4px 8px;
  border-radius:4px;
}
.footer-links a:hover{
  color:var(--primary-bright);
  text-decoration:underline;
}

/* ===== EMAIL STATUS ICON ===== */
.email-status-icon{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  display:none;
}
.email-status-icon.show{display:block;}
.email-status-icon.valid{color:var(--btn-green);}
.email-status-icon.invalid{color:var(--sale-red);}
.email-status-icon.loading{color:var(--gold);animation:spin 1s linear infinite;}

/* ===== TOAST ===== */
#toast{
  position:fixed;
  bottom:24px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:var(--text);
  color:#fff;
  padding:12px 24px;
  border-radius:60px;
  font-size:.8rem;
  font-weight:500;
  opacity:0;
  transition:all .3s cubic-bezier(0.34,1.56,0.64,1);
  z-index:900;
  pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,0.2);
  max-width:90%;
  text-align:center;
}
#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
#toast.success{background:var(--btn-green-hover);}
#toast.error{background:var(--sale-red);}

/* ===== SPINNER ===== */
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== RESPONSIVE ===== */
@media(max-width:480px){
  .auth-card{padding:24px 18px;border-radius:20px;}
  .auth-card h1{font-size:1.3rem;}
  .brand-icon{width:52px;height:52px;}
  .brand-icon i{font-size:26px;}
  .top-bar{padding:10px 4%;min-height:56px;}
  .logo-text{font-size:1rem;}
  .logo-img{height:32px;width:32px;}
  .btn-primary{padding:14px;font-size:.85rem;}
  .google-btn{padding:12px;font-size:.8rem;}
  .field-input{padding:12px 14px;font-size:.85rem;}
}
</style>
</head>
<body>

<header class="top-bar">
  <a class="logo" href="index.html">
    <img class="logo-img" src="https://res.cloudinary.com/dvqjgbdhp/image/upload/f_auto,q_auto,w_120,c_fit/v1780905905/WhatsApp_Image_2026-06-04_at_3.41.50_PM_saprsh.jpg" alt="LiquorBelle">
    <div class="logo-text">Liquor<span class="gold">Belle</span></div>
  </a>
  <a class="back-link" href="accounts.html"><i class="ph ph-arrow-left"></i> Back</a>
</header>

<div class="page-wrap">
  <div class="auth-card">

    <div class="brand-icon"><i class="ph ph-wine"></i></div>
    <h1>Welcome Back</h1>
    <p class="lead">Sign in to your LiquorBelle account</p>

    <!-- ===== SESSION EXPIRED BANNER ===== -->
    <div id="sessionExpiredBanner">
      <i class="ph ph-clock"></i> Your session expired. Please log in again.
    </div>

    <div class="banner" id="loginBanner"></div>

    <form id="loginForm">
      <div class="field-group">
        <label class="field-label">Email address</label>
        <div class="field-input-wrap">
          <input class="field-input" id="emailInput" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
          <span class="email-status-icon" id="emailCheckIcon"></span>

        <div class="field-error" id="emailError"></div>
        <div class="field-hint" id="emailCheckMessage"></div>

      <div class="field-group">

        <div class="digit-group" id="pinDigitGroup">

          <input class="digit-box" type="password" inputmode="numeric" maxlength="1" data-index="2" autocomplete="off">
          <input class="digit-box" type="password" inputmode="numeric" maxlength="1" data-index="3" autocomplete="off">
        </div>
        <div class="pin-toggle-row">
          <button type="button" class="pin-toggle" id="pinToggleBtn">
            <i class="ph ph-eye"></i> Show PIN

      </div>

      <button type="submit" class="btn-primary" id="loginBtn">
        <span id="loginBtnText">Sign In</span>
      </button>

    <div style="text-align:center;margin-top:10px;">
      <button type="button" class="btn-link" id="forgotPinBtn">Forgot PIN?</button>
    </div>

    <div class="divider">OR</div>

    <button class="google-btn" id="googleLoginBtn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
      Continue with Google
    </button>

    <p class="footer-links">Don't have an account? <a href="signup.html">Create one</a></p>

  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================
// SESSION EXPIRED CHECK
// ============================================================
if (window.location.search.includes('session=expired')) {
  var banner = document.getElementById('sessionExpiredBanner');
  if (banner) {
    banner.classList.add('show');
    setTimeout(function() {
      banner.classList.remove('show');
    }, 6000);
  }
}

// ============================================================
// CONFIG
// ============================================================
const API_BASE = 'https://liquorbelle-mpesa-backend.onrender.com';
const AUTH_BASE = API_BASE + '/api/auth';
const TOAST_DURATION = 3000;
const DEBOUNCE_DELAY = 500;

// ============================================================
// UTILITY FUNCTIONS
// ============================================================
function isValidEmail(email) {
  return /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email.trim());
}

function decodeJWT(token) {
  try {
    var parts = token.split('.');
    if (parts.length !== 3) return null;
    var payload = parts[1].replace(/-/g, '+').replace(/_/g, '/');
    while (payload.length % 4) payload += '=';
    return JSON.parse(atob(payload));
  } catch (e) {
    return null;
  }
}

function getRedirectTarget() {
  var params = new URLSearchParams(window.location.search);
  return params.get('redirect') || 'accounts.html';
}

function toast(msg, type) {
  var t = document.getElementById('toast');
  if (!t) return;
  t.textContent = msg;
  t.className = '';
  if (type === 'error') t.classList.add('error');
  if (type === 'success') t.classList.add('success');
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('show'); }, TOAST_DURATION);
}

function showBanner(id, msg, type) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.className = 'banner show ' + type;
}

function hideBanner(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.className = 'banner';
}

function setFieldError(id, msg) {
  var el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg || '';
  el.classList.toggle('show', !!msg);
}

function setLoading(btnId, textId, loading, loadingText, normalText) {
  var btn = document.getElementById(btnId);
  var textEl = document.getElementById(textId);
  if (!btn) return;
  btn.disabled = loading;
  if (textEl) textEl.innerHTML = loading ? '<span class="spinner"></span> ' + loadingText : normalText;
}

// ============================================================
// SESSION GUARD
// ============================================================
(function guardExistingSession() {
  var token = localStorage.getItem('liquorbelle_token');
  var user = localStorage.getItem('liquorbelle_user');
  if (!token || !user) return;

  var payload = decodeJWT(token);
  if (payload && typeof payload.exp === 'number' && Date.now() >= payload.exp * 1000) {
    localStorage.removeItem('liquorbelle_token');
    localStorage.removeItem('liquorbelle_user');
    localStorage.removeItem('liquorbelle_login_time');
    return;
  }
  window.location.href = getRedirectTarget();
})();

// ============================================================
// DIGIT GROUP HELPER
// ============================================================
function wireDigitGroup(groupEl) {
  var boxes = Array.prototype.slice.call(groupEl.querySelectorAll('.digit-box'));

  boxes.forEach(function(box, i) {
    box.addEventListener('input', function() {
      box.value = box.value.replace(/\D/g, '').slice(0, 1);
      box.classList.toggle('filled', !!box.value);
      box.classList.remove('error');
      if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
    });

    box.addEventListener('keydown', function(e) {
      if (e.key === 'Backspace' && !box.value && i > 0) {
        boxes[i - 1].focus();
      }
    });

    box.addEventListener('paste', function(e) {
      e.preventDefault();
      var pasted = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      for (var j = 0; j < boxes.length; j++) {
        boxes[j].value = pasted[j] || '';
        boxes[j].classList.toggle('filled', !!boxes[j].value);
      }
      var lastFilled = Math.min(pasted.length, boxes.length) - 1;
      if (lastFilled >= 0) boxes[lastFilled].focus();
    });
  });

  return {
    getValue: function() { return boxes.map(function(b) { return b.value; }).join(''); },
    clear: function() {
      boxes.forEach(function(b) { b.value = ''; b.classList.remove('filled', 'error'); });
      boxes[0].focus();
    },
    setType: function(type) { boxes.forEach(function(b) { b.type = type; }); },
    setError: function() { boxes.forEach(function(b) { b.classList.add('error'); }); },
    removeError: function() { boxes.forEach(function(b) { b.classList.remove('error'); }); }
  };
}

var pinGroup = wireDigitGroup(document.getElementById('pinDigitGroup'));

// ============================================================
// TOGGLE PIN VISIBILITY
// ============================================================
document.getElementById('pinToggleBtn').addEventListener('click', function() {
  var isHidden = this.dataset.hidden !== 'false';
  pinGroup.setType(isHidden ? 'text' : 'password');
  this.innerHTML = isHidden
    ? '<i class="ph ph-eye-slash"></i> Hide PIN'
    : '<i class="ph ph-eye"></i> Show PIN';
  this.dataset.hidden = isHidden ? 'false' : 'true';
});

// ============================================================
// CHECK IF EMAIL EXISTS - SILENT
// ============================================================
function checkEmailExists(email) {
  return fetch(AUTH_BASE + '/check-user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email })
  })
  .then(function(res) { return res.json(); })
  .then(function(data) {
    return data.exists || false;
  })
  .catch(function() {
    return false;
  });
}

// ============================================================
// EMAIL INPUT - SILENT CHECK
// ============================================================
var emailCheckTimeout = null;
var emailExists = false;

function updateEmailStatus(isValid, isRegistered) {
  var icon = document.getElementById('emailCheckIcon');
  var msg = document.getElementById('emailCheckMessage');
  var input = document.getElementById('emailInput');

  if (!isValid) {
    icon.className = 'email-status-icon';
    msg.textContent = '';
    input.classList.remove('success', 'error');
    return;
  }

  if (isRegistered) {
    icon.className = 'email-status-icon show valid ph ph-check-circle';
    msg.textContent = '';
    input.classList.remove('error');
    input.classList.add('success');
  } else {
    icon.className = 'email-status-icon show invalid ph ph-x-circle';
    msg.textContent = 'Email not registered';
    msg.style.color = 'var(--sale-red)';
    input.classList.add('error');
    input.classList.remove('success');
  }
}

document.getElementById('emailInput').addEventListener('input', function() {
  var email = this.value.trim();
  var icon = document.getElementById('emailCheckIcon');
  var msg = document.getElementById('emailCheckMessage');

  this.classList.remove('error', 'success');
  icon.className = 'email-status-icon';
  msg.textContent = '';
  msg.style.color = '';
  hideBanner('loginBanner');
  emailExists = false;

  if (!email) return;

  if (!isValidEmail(email)) {
    this.classList.add('error');
    return;
  }

  icon.className = 'email-status-icon show loading ph ph-spinner';
  msg.textContent = 'Checking...';
  msg.style.color = 'var(--muted)';

  clearTimeout(emailCheckTimeout);
  emailCheckTimeout = setTimeout(function() {
    checkEmailExists(email)
      .then(function(exists) {
        emailExists = exists;
        updateEmailStatus(true, exists);
      })
      .catch(function() {
        icon.className = 'email-status-icon';
        msg.textContent = '';
      });
  }, DEBOUNCE_DELAY);
});

document.getElementById('emailInput').addEventListener('blur', function() {
  var email = this.value.trim();
  if (email && !isValidEmail(email)) {
    this.classList.add('error');
    this.classList.remove('success');
    setFieldError('emailError', 'Please enter a valid email address');
  }
});

// ============================================================
// LOGIN FORM SUBMIT
// ============================================================
document.getElementById('loginForm').addEventListener('submit', function(e) {
  e.preventDefault();

  var email = document.getElementById('emailInput').value.trim();
  var pin = pinGroup.getValue();

  setFieldError('emailError', '');
  setFieldError('pinError', '');
  hideBanner('loginBanner');
  pinGroup.removeError();

  if (!isValidEmail(email)) {
    setFieldError('emailError', 'Please enter a valid email address');
    document.getElementById('emailInput').classList.add('error');
    document.getElementById('emailInput').focus();
    return;
  }
  document.getElementById('emailInput').classList.remove('error');

  if (!emailExists) {
    setFieldError('emailError', 'This email is not registered. Please create an account.');
    document.getElementById('emailInput').classList.add('error');
    document.getElementById('emailInput').focus();
    return;
  }

  if (pin.length !== 4) {
    setFieldError('pinError', 'Enter your 4-digit PIN');
    pinGroup.setError();
    return;
  }

  setLoading('loginBtn', 'loginBtnText', true, 'Signing in...', 'Sign In');

  fetch(AUTH_BASE + '/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, pin: pin })
  })
  .then(function(res) { return res.json().then(function(data) { return { status: res.status, data: data }; }); })
  .then(function(result) {
    setLoading('loginBtn', 'loginBtnText', false, '', 'Sign In');

    if (result.status === 200 && result.data.success) {
      localStorage.setItem('liquorbelle_token', result.data.token);
      localStorage.setItem('liquorbelle_user', JSON.stringify(result.data.customer));
      localStorage.setItem('liquorbelle_login_time', Date.now().toString());
      toast('Welcome back!', 'success');
      setTimeout(function() {
        window.location.href = getRedirectTarget();
      }, 400);
      return;
    }

    if (result.status === 404) {
      setFieldError('emailError', 'This email is not registered. Please create an account.');
      document.getElementById('emailInput').classList.add('error');
      return;
    }

    if (result.status === 429) {
      setFieldError('pinError', result.data.message || 'Too many attempts. Please try again later.');
      pinGroup.setError();
      return;
    }

    if (result.status === 401) {
      setFieldError('pinError', result.data.message || 'Invalid PIN. Please try again.');
      pinGroup.setError();
      pinGroup.clear();
      document.querySelector('.digit-box').focus();
      return;
    }

    setFieldError('pinError', result.data.message || 'Login failed. Please try again.');
    pinGroup.setError();
    pinGroup.clear();
  })
  .catch(function(err) {
    setLoading('loginBtn', 'loginBtnText', false, '', 'Sign In');
    setFieldError('pinError', 'Network error. Please check your connection.');
    console.error('Login error:', err);
  });
});

// ============================================================
// GOOGLE LOGIN - Redirect to backend OAuth
// ============================================================
document.getElementById('googleLoginBtn').addEventListener('click', function() {
  var btn = this;
  var email = document.getElementById('emailInput').value.trim();
  
  if (!email) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Redirecting...';
    window.location.href = AUTH_BASE + '/google';
    return;
  }

  if (!isValidEmail(email)) {
    setFieldError('emailError', 'Please enter a valid email address');
    document.getElementById('emailInput').classList.add('error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Checking...';

  checkEmailExists(email)
    .then(function(exists) {
      if (!exists) {
        btn.disabled = false;
        btn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Continue with Google';
        setFieldError('emailError', 'This email is not registered. Please create an account first.');
        document.getElementById('emailInput').classList.add('error');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Redirecting...';
      window.location.href = AUTH_BASE + '/google?email=' + encodeURIComponent(email);
    })
    .catch(function() {
      btn.disabled = false;
      btn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"> Continue with Google';
      toast('Network error. Please try again.', 'error');
    });
});

// ============================================================
// FORGOT PIN
// ============================================================
document.getElementById('forgotPinBtn').addEventListener('click', function() {
  var email = document.getElementById('emailInput').value.trim();
  
  if (!email || !isValidEmail(email)) {
    setFieldError('emailError', 'Please enter your email address first');
    document.getElementById('emailInput').classList.add('error');
    document.getElementById('emailInput').focus();
    return;
  }

  if (!emailExists) {
    setFieldError('emailError', 'This email is not registered. Please create an account.');
    document.getElementById('emailInput').classList.add('error');
    return;
  }
  
  toast('A PIN reset link has been sent to ' + email, 'info');
});

// ============================================================
// HANDLE GOOGLE CALLBACK FROM BACKEND
// ============================================================
function handleGoogleCallback() {
  var params = new URLSearchParams(window.location.search);
  var googleAuth = params.get('google_auth');
  var token = params.get('token');
  var email = params.get('email');
  var name = params.get('name');
  var phone = params.get('phone') || '';
  var isNew = params.get('is_new') === 'true';

  if (googleAuth !== 'success' || !token || !email) {
    return;
  }

  var cleanUrl = window.location.pathname + window.location.search.replace(/[?&]google_auth=[^&]*/, '').replace(/[?&]token=[^&]*/, '').replace(/[?&]email=[^&]*/, '').replace(/[?&]name=[^&]*/, '').replace(/[?&]phone=[^&]*/, '').replace(/[?&]is_new=[^&]*/, '');
  if (window.history && window.history.replaceState) {
    window.history.replaceState({}, document.title, cleanUrl);
  }

  if (isNew) {
    sessionStorage.setItem('liquorbelle_google_pending', JSON.stringify({
      token: token,
      email: decodeURIComponent(email),
      name: decodeURIComponent(name),
      phone: phone
    }));
    toast('Welcome! Please complete your registration.', 'success');
    setTimeout(function() {
      window.location.href = 'signup.html?google=1';
    }, 500);
    return;
  }

  var user = {
    id: Date.now().toString(),
    email: decodeURIComponent(email),
    name: decodeURIComponent(name),
    phone: phone,
    token: token,
    loggedIn: true,
    loginTime: Date.now(),
    authMethod: 'google'
  };

  localStorage.setItem('liquorbelle_user', JSON.stringify(user));
  localStorage.setItem('liquorbelle_token', token);
  localStorage.setItem('liquorbelle_login_time', Date.now().toString());

  toast('Welcome back, ' + user.name + '!', 'success');
  setTimeout(function() {
    window.location.href = getRedirectTarget();
  }, 500);
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  handleGoogleCallback();
  document.getElementById('emailInput').focus();

  var params = new URLSearchParams(window.location.search);
  var prefillEmail = params.get('email');
  if (prefillEmail && isValidEmail(prefillEmail)) {
    document.getElementById('emailInput').value = prefillEmail;
    var event = new Event('input');
    document.getElementById('emailInput').dispatchEvent(event);
  }
});
